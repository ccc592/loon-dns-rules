name: Update DNS plugin
on:
  workflow_dispatch:
  schedule:
    # Daily at 06:30 UTC+8; GitHub may delay scheduled runs.
    - cron: '30 22 * * *'
  push:
    paths:
      - scripts/**
      - foreign-dns-exceptions.txt
      - .github/workflows/update-dns.yml
permissions:
  contents: write
concurrency:
  group: update-dns
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate and validate full DNS plugin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_dns.py
      - name: Publish updated DNS mappings
        run: |
          git add plugins/China-DNS.lpx manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update complete CN DNS mappings'
          git push
